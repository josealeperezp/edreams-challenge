spring:
  application:
    name: flights-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/flights}
    username: ${DB_USER:flights}
    password: ${DB_PASSWORD:flights}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    build:
      enabled: true

providers:
  alpha:
    base-url: ${PROVIDERS_ALPHA_URL:http://localhost:8081/alpha}
    timeout: ${PROVIDERS_ALPHA_TIMEOUT:3s}
  beta:
    base-url: ${PROVIDERS_BETA_URL:http://localhost:8081/beta}
    timeout: ${PROVIDERS_BETA_TIMEOUT:3s}
  gamma:
    base-url: ${PROVIDERS_GAMMA_URL:http://localhost:8081/gamma}
    timeout: ${PROVIDERS_GAMMA_TIMEOUT:3s}
