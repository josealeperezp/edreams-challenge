spring:
  application:
    name: providers-mock
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Every knob is a pure input to a deterministic generator: same values, same inventory.
mock:
  seed: ${MOCK_SEED:42}
  inventory:
    size: ${MOCK_INVENTORY_SIZE:100000}      # unique itineraries across all providers
    days: ${MOCK_INVENTORY_DAYS:30}          # departure window from base-date; grows if size needs it
    base-date: ${MOCK_BASE_DATE:}            # yyyy-MM-dd; empty means today (UTC)
    corruption-rate: ${MOCK_CORRUPTION_RATE:0.015}
    shares:
      alpha: 0.70
      beta: 0.65
      gamma: 0.60
  chaos:
    enabled: ${MOCK_CHAOS_ENABLED:true}
    latency-min-ms: ${MOCK_LATENCY_MIN_MS:100}
    latency-max-ms: ${MOCK_LATENCY_MAX_MS:5000}
    error-rate: ${MOCK_ERROR_RATE:0.10}
    # per-provider overrides, e.g.
    # providers:
    #   beta:
    #     error-rate: 0.3
