server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API and actuator are proxied to the backend. Buffering is off and the read
  # timeout is long so Server-Sent Events work through this proxy.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /actuator/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
